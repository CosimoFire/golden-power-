<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden power - prova degli embed</title>
<style>
body{font-family:Georgia,serif;max-width:620px;margin:0 auto;padding:20px 12px;color:#1a1a1a}
p.art{line-height:1.6}
iframe{width:100%;border:0;display:block;margin:24px 0}
</style>
</head>
<body>
<p class="art">Questa pagina simula un articolo e mostra i due grafici incorporati come farebbe il sito di notizie. L'altezza degli iframe si adatta da sola al contenuto.</p>

<iframe src="flusso.html" title="Come funziona il golden power" scrolling="no"></iframe>

<p class="art">Testo dell'articolo tra i due grafici.</p>

<iframe src="dashboard.html" title="Golden power: paesi e settori" scrolling="no"></iframe>

<script>
window.addEventListener('message', function (e) {
  if (!e.data || !e.data.gpEmbed || !e.data.height) return;
  document.querySelectorAll('iframe').forEach(function (f) {
    if (f.contentWindow === e.source) f.style.height = e.data.height + 'px';
  });
});
</script>
</body>
</html>
